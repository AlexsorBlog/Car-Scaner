<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CarSense — Адмін-панель</title>
<style>
  :root {
    --bg:#050505; --card:#111318; --line:#232733; --txt:#e6e8ee;
    --dim:#8b93a5; --accent:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  a { color:var(--accent); }
  .wrap { max-width:1240px; margin:0 auto; padding:20px; }
  h1 { font-size:18px; margin:0; letter-spacing:.14em; text-transform:uppercase; }
  header { display:flex; justify-content:space-between; align-items:center;
           padding-bottom:16px; border-bottom:1px solid var(--line); margin-bottom:20px; gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); }
  .stat b { display:block; font-size:24px; font-weight:800; }
  .stat span { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
  table { width:100%; border-collapse:collapse; margin-top:12px; }
  th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); font-size:13px;
          white-space:nowrap; }
  th { color:var(--dim); font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
  tbody tr:hover { background:#161a24; }
  input,button,select { font:inherit; }
  input,select { background:#0b0d12; border:1px solid var(--line); color:var(--txt);
                 border-radius:9px; padding:9px 11px; }
  input:focus,select:focus { outline:none; border-color:var(--accent); }
  button { background:var(--accent); color:#fff; border:0; border-radius:9px;
           padding:9px 13px; cursor:pointer; font-weight:600; }
  button.ghost { background:#1b1f2a; color:var(--txt); border:1px solid var(--line); }
  button.danger { background:#3a1417; color:#ff9b9b; border:1px solid #5b1d22; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .tag { font-size:10px; padding:2px 7px; border-radius:999px; font-weight:700; }
  .tag.admin { background:rgba(59,130,246,.15); color:#93c5fd; }
  .tag.blocked { background:rgba(239,68,68,.15); color:#fca5a5; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .muted { color:var(--dim); }
  .bar { height:5px; background:var(--accent); border-radius:3px; min-width:2px; }
  #login { max-width:340px; margin:14vh auto; }
  #login input { width:100%; margin-bottom:10px; }
  #login button { width:100%; }
  .err { color:#fca5a5; font-size:12px; min-height:17px; }
  .tabs { display:flex; gap:6px; margin:18px 0 10px; flex-wrap:wrap; }
  .tabs button { background:#1b1f2a; border:1px solid var(--line); }
  .tabs button.on { background:var(--accent); border-color:var(--accent); }
  .hidden { display:none !important; }
  .scroll { overflow-x:auto; }
</style>
</head>
<body>

<div id="login" class="card">
  <h1 style="margin-bottom:14px">CarSense Admin</h1>
  <input id="l-phone" placeholder="Телефон (+380…)" autocomplete="username" />
  <input id="l-pass" type="password" placeholder="Пароль" autocomplete="current-password" />
  <button id="l-btn">Увійти</button>
  <p id="l-err" class="err"></p>
</div>

<div id="app" class="wrap hidden">
  <header>
    <h1>CarSense — Адмін</h1>
    <div class="row">
      <span id="me" class="muted"></span>
      <button class="ghost" id="refresh">Оновити</button>
      <button class="ghost" id="logout">Вийти</button>
    </div>
  </header>

  <div class="grid" id="stats"></div>

  <div class="tabs">
    <button data-tab="users" class="on">Користувачі</button>
    <button data-tab="usage">Витрати токенів</button>
    <button data-tab="activity">Активність</button>
  </div>

  <section id="tab-users" class="card">
    <div class="row">
      <input id="search" placeholder="Пошук: телефон, імʼя, email" style="flex:1;min-width:200px" />
      <span id="users-count" class="muted"></span>
    </div>
    <div class="scroll">
      <table>
        <thead><tr>
          <th>ID</th><th>Користувач</th><th>Авто</th><th>Токени</th><th>AI</th>
          <th>Повідом.</th><th>Заїзди</th><th>Реєстрація</th><th>Активність</th><th></th>
        </tr></thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="ghost" id="prev">← Назад</button>
      <button class="ghost" id="next">Далі →</button>
    </div>
  </section>

  <section id="tab-usage" class="card hidden">
    <div class="row"><b>Токени за днями</b>
      <select id="days">
        <option value="7">7 днів</option>
        <option value="14" selected>14 днів</option>
        <option value="30">30 днів</option>
      </select>
    </div>
    <div id="usage-chart" style="margin-top:14px"></div>
  </section>

  <section id="tab-activity" class="card hidden">
    <b>Останні дії</b>
    <div class="scroll">
      <table>
        <thead><tr><th>Час</th><th>Користувач</th><th>Дія</th><th>Деталі</th></tr></thead>
        <tbody id="activity-body"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const $ = (s) => document.querySelector(s);
const KEY = 'carsense_admin_token';
let token = localStorage.getItem(KEY) || '';
let offset = 0, search = '', me = null;

const fmt = (n) => (n == null ? '—' : Number(n).toLocaleString('uk-UA'));
const when = (d) => d ? new Date(d).toLocaleString('uk-UA', {dateStyle:'short', timeStyle:'short'}) : '—';
const ago = (d) => {
  if (!d) return '<span class="muted">ніколи</span>';
  const m = Math.floor((Date.now() - new Date(d)) / 60000);
  if (m < 60) return `${m} хв тому`;
  if (m < 1440) return `${Math.floor(m/60)} год тому`;
  return `${Math.floor(m/1440)} дн тому`;
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opts.headers||{}) },
  });
  if (res.status === 401 || res.status === 403) { doLogout(); throw new Error('Немає доступу'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || data.detail || ('HTTP ' + res.status));
  return data;
}

// ── Login ──────────────────────────────────────────────────────────────────
$('#l-btn').onclick = async () => {
  $('#l-err').textContent = '';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ phone: $('#l-phone').value.trim(), password: $('#l-pass').value }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || d.detail || 'Помилка входу');
    token = d.token; localStorage.setItem(KEY, token); me = d.user;
    await boot();
  } catch (e) { $('#l-err').textContent = e.message; }
};
$('#l-pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('#l-btn').click(); });

function doLogout() {
  token = ''; localStorage.removeItem(KEY);
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
}
$('#logout').onclick = doLogout;
$('#refresh').onclick = () => boot();

// ── Boot ───────────────────────────────────────────────────────────────────
async function boot() {
  try {
    const s = await api('/admin/stats');   // also the admin-rights check
    $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
    if (me) $('#me').textContent = me.name || me.phone;
    renderStats(s);
    await Promise.all([loadUsers(), loadUsage(), loadActivity()]);
  } catch (e) {
    $('#l-err').textContent = e.message.includes('Admin')
      ? 'Цей акаунт не має прав адміністратора' : e.message;
    doLogout();
  }
}

function renderStats(s) {
  const c = [
    ['Користувачів', fmt(s.users.total)],
    ['Активні 24г', fmt(s.users.active_24h)],
    ['Активні 7д', fmt(s.users.active_7d)],
    ['Нові 7д', fmt(s.users.new_7d)],
    ['Заблоковані', fmt(s.users.blocked)],
    ['Токени всього', fmt(s.tokens.total)],
    ['Токени 24г', fmt(s.tokens.today)],
    ['Токени 7д', fmt(s.tokens.week)],
    ['AI-запитів', fmt(s.tokens.requests)],
    ['Витрати ~$', s.estimated_cost_usd?.toFixed(2) ?? '0.00'],
    ['Повідомлень', fmt(s.content.messages)],
    ['Заїздів', fmt(s.content.perf_records)],
  ];
  $('#stats').innerHTML = c.map(([k,v]) =>
    `<div class="card stat"><span>${k}</span><b>${v}</b></div>`).join('');
}

// ── Users ──────────────────────────────────────────────────────────────────
async function loadUsers() {
  const d = await api(`/admin/users?search=${encodeURIComponent(search)}&limit=50&offset=${offset}`);
  $('#users-count').textContent = `${d.total} всього`;
  $('#prev').disabled = offset === 0;
  $('#next').disabled = offset + 50 >= d.total;
  $('#users-body').innerHTML = d.users.map(u => `
    <tr>
      <td class="muted">${u.id}</td>
      <td>
        <div><b>${esc(u.name) || '<span class="muted">без імені</span>'}</b>
          ${u.is_admin ? '<span class="tag admin">ADMIN</span>' : ''}
          ${u.is_blocked ? '<span class="tag blocked">BLOCKED</span>' : ''}</div>
        <div class="muted">${esc(u.phone)}${u.email ? ' · ' + esc(u.email) : ''}</div>
      </td>
      <td class="muted">${esc([u.car_brand,u.car_model].filter(Boolean).join(' ')) || '—'}</td>
      <td>${fmt(u.total_tokens)}</td>
      <td>${fmt(u.ai_requests)}</td>
      <td>${fmt(u.messages)}</td>
      <td>${fmt(u.perf_runs)}</td>
      <td class="muted">${when(u.created_at)}</td>
      <td class="muted">${ago(u.last_seen_at)}</td>
      <td class="row">
        <button class="ghost" data-act="pw" data-id="${u.id}">Пароль</button>
        <button class="ghost" data-act="block" data-id="${u.id}" data-v="${u.is_blocked?0:1}">
          ${u.is_blocked ? 'Розблок.' : 'Блок'}</button>
        <button class="ghost" data-act="admin" data-id="${u.id}" data-v="${u.is_admin?0:1}">
          ${u.is_admin ? 'Зняти адм.' : 'Адмін'}</button>
        <button class="danger" data-act="del" data-id="${u.id}">Видалити</button>
      </td>
    </tr>`).join('') || '<tr><td colspan="10" class="muted">Нічого не знайдено</td></tr>';
}

$('#users-body').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  try {
    if (act === 'pw') {
      const pw = prompt(`Новий пароль для користувача #${id} (мін. 6 символів):`);
      if (!pw) return;
      if (pw.length < 6) return alert('Мінімум 6 символів');
      await api(`/admin/users/${id}/password`, { method:'PUT', body: JSON.stringify({ password: pw }) });
      alert('Пароль змінено');
    } else if (act === 'block') {
      await api(`/admin/users/${id}/blocked`, { method:'PUT', body: JSON.stringify({ value: b.dataset.v === '1' }) });
    } else if (act === 'admin') {
      await api(`/admin/users/${id}/admin`, { method:'PUT', body: JSON.stringify({ value: b.dataset.v === '1' }) });
    } else if (act === 'del') {
      if (!confirm(`Видалити користувача #${id}? Це видалить усі його дані. Дію не можна відмінити.`)) return;
      await api(`/admin/users/${id}`, { method:'DELETE' });
    }
    await loadUsers();
    renderStats(await api('/admin/stats'));
  } catch (err) { alert(err.message); }
});

let searchTimer;
$('#search').oninput = (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { search = e.target.value.trim(); offset = 0; loadUsers(); }, 300);
};
$('#prev').onclick = () => { offset = Math.max(0, offset - 50); loadUsers(); };
$('#next').onclick = () => { offset += 50; loadUsers(); };

// ── Usage ──────────────────────────────────────────────────────────────────
async function loadUsage() {
  const d = await api('/admin/usage?days=' + $('#days').value);
  const max = Math.max(1, ...d.series.map(r => Number(r.tokens) || 0));
  $('#usage-chart').innerHTML = d.series.length ? d.series.map(r => {
    const t = Number(r.tokens) || 0;
    return `<div style="margin-bottom:9px">
      <div class="row" style="justify-content:space-between">
        <span class="muted">${new Date(r.day).toLocaleDateString('uk-UA')}</span>
        <span>${fmt(t)} ток · ${fmt(r.requests)} запитів</span>
      </div>
      <div class="bar" style="width:${(t/max*100).toFixed(1)}%"></div>
    </div>`;
  }).join('') : '<p class="muted">Поки немає даних</p>';
}
$('#days').onchange = loadUsage;

// ── Activity ───────────────────────────────────────────────────────────────
async function loadActivity() {
  const d = await api('/admin/activity?limit=100');
  $('#activity-body').innerHTML = d.activity.map(a => `
    <tr><td class="muted">${when(a.created_at)}</td>
        <td>${esc(a.name || a.phone || '—')}</td>
        <td>${esc(a.action)}</td>
        <td class="muted">${esc(a.detail || '')}</td></tr>`).join('')
    || '<tr><td colspan="4" class="muted">Поки немає активності</td></tr>';
}

// ── Tabs ───────────────────────────────────────────────────────────────────
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['users','usage','activity'].forEach(t =>
    $('#tab-' + t).classList.toggle('hidden', t !== b.dataset.tab));
});

if (token) boot();
</script>
</body>
</html>
